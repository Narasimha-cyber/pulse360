<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Pulse360</title>
  <style>
    body { 
      font-family: Arial; 
      padding: 20px; 
      background: #f5f5f5;
    }
    h2 { color: #ff6600; text-align: center; }
   .news-card { 
      background: white; 
      border: 1px solid #ddd; 
      padding: 15px; 
      margin: 15px 0; 
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    img { 
      max-width: 100%; 
      max-height: 300px;
      border-radius: 8px; 
      margin: 10px 0;
    }
    button { 
      padding: 10px 20px; 
      margin: 5px; 
      cursor: pointer; 
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
    }
   .approve { background: green; color: white; }
   .approve:hover { background: #0a7a0a; }
   .reject { background: red; color: white; }
   .reject:hover { background: #d00000; }
   .time { color: #666; font-size: 12px; }
    #newsList { max-width: 800px; margin: 0 auto; }
  </style>
</head>
<body>
  <h2>🔥 Pulse360 Admin Panel - Pending News</h2>
  <div id="newsList">Loading...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",
      authDomain: "pulse360-news.firebaseapp.com",
      projectId: "pulse360-news",
      storageBucket: "pulse360-news.firebasestorage.app",
      messagingSenderId: "789441397313",
      appId: "1:789441397313:web:ff3abd4184818b23d13cc0"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadNews() {
      const newsList = document.getElementById('newsList');
      newsList.innerHTML = "Loading...";
      
      // Only pending news + latest first
      const q = query(
        collection(db, "news"), 
        where("status", "==", "pending"),
        orderBy("createdAt", "desc")
      );
      const querySnapshot = await getDocs(q);
      
      if(querySnapshot.empty) {
        newsList.innerHTML = "<h3 style='text-align:center'>✅ No pending news</h3>";
        return;
      }

      let html = "";
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString("te-IN") : "Just now";
        
        html += `<div class="news-card">
          <h3>${data.title}</h3>
          <p class="time">Submitted: ${date}</p>
          <p>${data.description}</p>
          <img src="${data.imageUrl}" alt="News Image">
          <br>
          <button class="approve" onclick="approve('${docSnap.id}')">✅ Approve</button>
          <button class="reject" onclick="reject('${docSnap.id}')">❌ Reject</button>
        </div>`;
      });
      newsList.innerHTML = html;
    }

    window.approve = async (id) => {
      if(confirm("Approve this news?")) {
        await updateDoc(doc(db, "news", id), { status: "approved" });
        alert("✅ Approved!");
        loadNews();
      }
    }
    
    window.reject = async (id) => {
      if(confirm("Reject this news?")) {
        await updateDoc(doc(db, "news", id), { status: "rejected" });
        alert("❌ Rejected!");
        loadNews();
      }
    }

    loadNews();
    // Every 10 seconds auto refresh
    setInterval(loadNews, 10000);
  </script>
</body>
</html>
