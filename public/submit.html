<!DOCTYPE html>
<html>
<head>
  <title>Submit News - Pulse360</title>
  <style>
    body{background:#fff5f0;font-family:sans-serif;padding:20px}
   .form{background:white;padding:20px;border-radius:10px;max-width:500px;margin:auto;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    input,textarea{width:100%;padding:10px;margin:10px 0;border:1px solid #ddd;border-radius:5px}
    button{background:#ff6b35;color:white;border:none;padding:12px 20px;border-radius:5px;cursor:pointer;width:100%;font-weight:bold}
    button:disabled{opacity:0.6}
  </style>
</head>
<body>
  <div class="form">
    <h2 style="color:#ff6b35">📢 Submit News</h2>
    <form>
      <input type="text" name="title" placeholder="News Title" required>
      <textarea name="description" placeholder="News Description" rows="4" required></textarea>
      <input type="file" name="image" accept="image/*" required>
      <button type="submit">Submit News</button>
    </form>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
  // 👇 IKKADA NEE FIREBASE CONFIG PASTE CHEYYI
  const firebaseConfig = {
    apiKey: "PASTE_HERE",
    authDomain: "PASTE_HERE",
    projectId: "PASTE_HERE",
    appId: "PASTE_HERE"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 👇 NEE CLOUDINARY DETAILS - Already set chesanu
  const CLOUD_NAME = "ld6mifgm";
  const UPLOAD_PRESET = "reporter_upload";

  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.innerText = "Uploading...";
    btn.disabled = true;

    const title = e.target.title.value;
    const description = e.target.description.value;
    const file = e.target.image.files[0];

    // 1. Cloudinary ki image upload
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {method: 'POST', body: formData});
    const data = await res.json();

    // 2. Firebase lo data save
    await db.collection("pendingNews").add({
      title, description,
      image: data.secure_url,
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("✅ News submitted! Admin approval kosam wait cheyyandi");
    e.target.reset();
    btn.innerText = "Submit News";
    btn.disabled = false;
  });
</script>
</body>
</html>
