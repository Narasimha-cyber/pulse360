<!DOCTYPE html>
<html>
<head>
<title>Submit News</title>
<style>
  body{font-family:Arial;padding:20px;background:#f5f5f5}
  .box{background:white;padding:20px;border-radius:10px;max-width:500px;margin:auto}
  input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
  button{background:#007bff;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer}
  button:hover{background:#0056b3}
  label{font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>📢 Submit News</h2>
<form id="newsForm">
  <label>Title</label>
  <input name="title" placeholder="News Title" required>

  <label>Description</label>
  <textarea name="description" rows="4" placeholder="News Description" required></textarea>

  <label>Upload Image</label>
  <input type="file" name="image" required>

  <button type="submit">Submit</button>
</form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",authDomain:"pulse360-news.firebaseapp.com",projectId:"pulse360-news"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

document.getElementById('newsForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  await auth.signInAnonymously();
  await db.collection("pendingNews").add({
    title: e.target.title.value,
    description: e.target.description.value,
    city: "Eluru",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  alert("✅ Submitted! Admin approve chesaka live avthundi");
  e.target.reset();
});
</script>
</body></html>
