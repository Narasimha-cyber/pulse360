<!DOCTYPE html>
<html>
<head>
<title>Submit News</title>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.box{background:white;padding:20px;border-radius:10px;max-width:500px;margin:auto}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
button{background:#007bff;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer}
button:disabled{background:#ccc}
</style>
</head>
<body>
<div class="box">
<h2>📢 Submit News</h2>
<form id="newsForm">
<label>Title</label>
<input name="title" placeholder="News Title" required>
<label>Description</label>
<textarea name="description" rows="4" placeholder="News Description" required></textarea>
<label>Upload Image</label>
<input type="file" name="image" accept="image/*" required>
<button type="submit" id="btn">Submit</button>
</form>
<p id="status"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",
  authDomain:"pulse360-news.firebaseapp.com",
  projectId: "pulse360-news",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('newsForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.innerText = "Uploading...";

  try {
    // 1. Cloudinary ki image upload
    const imageFile = e.target.image.files[0];
    const formData = new FormData();
    formData.append('file', imageFile);
    formData.append('upload_preset', 'reporter_upload');

    const cloudRes = await fetch('https://api.cloudinary.com/v1_1/ld6mifgm/image/upload', {
      method: 'POST',
      body: formData
    });
    const cloudData = await cloudRes.json();
    const imageUrl = cloudData.secure_url;

    // 2. pendingNews lo save chey
    await addDoc(collection(db, "pendingNews"), {
      title: e.target.title.value,
      description: e.target.description.value,
      imageUrl: imageUrl, // IDHE IMPORTANT
      city: "Eluru",
      status: "pending",
      createdAt: serverTimestamp()
    });

    status.innerText = "✅ Submitted! Admin approve chesaka live avthundi";
    status.style.color = "green";
    e.target.reset();
  } catch(error) {
    status.innerText = "❌ Error: " + error.message;
    status.style.color = "red";
  }
  btn.disabled = false;
});
</script>
</body>
</html>
