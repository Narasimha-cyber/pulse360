<!DOCTYPE html>
<html><head><title>Submit</title></head><body>
<h2>Submit News</h2>
<form id="f"><input name="title" required><textarea name="desc" required></textarea><input type="file" name="img" required><button>Submit</button></form>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",authDomain:"pulse360-news.firebaseapp.com",projectId:"pulse360-news"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(); const auth = firebase.auth();
document.getElementById('f').addEventListener('submit', async e=>{e.preventDefault();await auth.signInAnonymously();await db.collection("pendingNews").add({title:e.target.title.value,description:e.target.desc.value,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert("Submitted to Admin")})
</script></body></html>
