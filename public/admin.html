<!DOCTYPE html>
<html>
<head>
  <title>Pulse360 Admin</title>
  <style>
    body{font-family:Arial; padding:20px; max-width:800px; margin:auto}
    .card{border:1px solid #ddd; padding:15px; margin:10px 0; border-radius:8px}
    .btn-approve{background:green; color:white; padding:8px 15px; border:none; cursor:pointer}
    .btn-delete{background:red; color:white; padding:8px 15px; border:none; cursor:pointer}
    input{padding:8px; width:200px; margin:5px}
  </style>
</head>
<body>
  <h1>Pulse360 Admin Panel</h1>

  <!-- LOGIN SECTION -->
  <div id="loginDiv">
    <h3>Admin Login</h3>
    <input type="email" id="email" placeholder="Admin Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red"></p>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminDiv" style="display:none">
    <button onclick="logout()">Logout</button>
    <h2>Pending News</h2>
    <div id="pendingList">Loading...</div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, getDocs, doc, deleteDoc, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",
        authDomain: "pulse360-news.firebaseapp.com",
        projectId: "pulse360-news",
        storageBucket: "pulse360-news.appspot.com",
        messagingSenderId: "789441397313",
        appId:  "1:789441397313:web:ff3abd4184818b23d13cc0",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Login/Logout functions
    window.login = () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, pass)
        .catch(err => document.getElementById('error').innerText = err.message);
    }
    window.logout = () => signOut(auth);

    // Login ayyaka em chupinchali
    onAuthStateChanged(auth, (user) => {
      if(user){
        document.getElementById('loginDiv').style.display = 'none';
        document.getElementById('adminDiv').style.display = 'block';
        loadPending();
      } else {
        document.getElementById('loginDiv').style.display = 'block';
        document.getElementById('adminDiv').style.display = 'none';
      }
    });

    // Pending news load cheyadam
    async function loadPending(){
      const querySnapshot = await getDocs(collection(db, "pendingNews"));
      let html = '';
      querySnapshot.forEach((docSnap) => {
        const news = docSnap.data();
        html += `
          <div class="card">
            <h3>${news.title}</h3>
            <img src="${news.image}" style="max-width:200px">
            <p>${news.description}</p>
            <small>By: ${news.reporterName}</small><br><br>
            <button class="btn-approve" onclick="approveNews('${docSnap.id}')">Approve</button>
            <button class="btn-delete" onclick="deleteNews('${docSnap.id}')">Delete</button>
          </div>
        `;
      });
      document.getElementById('pendingList').innerHTML = html || 'No pending news';
    }

    // Approve function
    window.approveNews = async (id) => {
      const docRef = doc(db, "pendingNews", id);
      const docSnap = await getDocs(collection(db, "pendingNews"));
      const news = docSnap.docs.find(d => d.id === id).data();
      
      await addDoc(collection(db, "publishedNews"), {...news, approvedAt: serverTimestamp()});
      await deleteDoc(docRef);
      alert('Approved!');
      loadPending();
    }

    // Delete function
    window.deleteNews = async (id) => {
      if(confirm('Delete this news?')){
        await deleteDoc(doc(db, "pendingNews", id));
        alert('Deleted!');
        loadPending();
      }
    }
  </script>
</body>
</html>
