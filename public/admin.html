<!DOCTYPE html>
<html>
<head>
    <title>Admin Debug</title>
</head>
<body>
    <h2>Admin Panel - Debug</h2>
    <div id="newsContainer">Loading...</div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA4cKX7gqRw1vllvlgzW2tC9x3zYbX9sQ",
            authDomain: "pulse360-news.firebaseapp.com",
            projectId: "pulse360-news",
            storageBucket: "pulse360-news.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcd1234"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const newsContainer = document.getElementById('newsContainer');

        async function loadPendingNews() {
            try {
                console.log("Fetching pendingNews...");
                const querySnapshot = await getDocs(collection(db, 'pendingNews')); // status ledu
                
                console.log("Docs found:", querySnapshot.size); // count chupisthundi
                
                if (querySnapshot.empty) {
                    newsContainer.innerHTML = '<p style="color:red">No documents found in pendingNews collection</p>';
                    return;
                }
                
                let newsHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const news = docSnap.data();
                    newsHTML += `<div style="border:1px solid black; padding:10px; margin:10px">
                        <h3>${news.title}</h3>
                        <p>${news.description}</p>
                        <button>Approve</button>
                    </div>`;
                });
                newsContainer.innerHTML = newsHTML;
                
            } catch (e) {
                newsContainer.innerHTML = `<p style="color:red">ERROR: ${e.message}</p>`;
                console.error("Full Error:", e);
            }
        }
        loadPendingNews();
    </script>
</body>
</html>
