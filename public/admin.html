<!DOCTYPE html>
<html>
<head>
    <title>Admin - Pulse360</title>
    <style>
        body{font-family:sans-serif;padding:20px}
        .card{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px}
        .error{color:red;text-align:center;margin-top:100px;font-size:20px}
    </style>
</head>
<body>
    <h2 style="color:#ff6b35">Pending News Requests</h2>
    <div id="content">Checking access...</div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        // 👇 SAME FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",
            authDomain: "pulse360-news.firebaseapp.com",
            projectId: "pulse360-news",
            appId: "1:789441397313:web:ff3abd4184818b23d13cc0",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 👇👇👇 SECRET KEY LOGIC
        const urlParams = new URLSearchParams(window.location.search);
        const key = urlParams.get('key');
        const SECRET_KEY = 'pulse360admin2026';

        if(key !== SECRET_KEY){
            document.getElementById('content').innerHTML = `
                <div class="error">Access Denied ❌<br>
                Use: admin.html?key=pulse360admin2026</div>
            `;
        } else {
            document.getElementById('content').innerHTML = `
                <h2 style="color:#ff6b35">Pending News Requests</h2>
                <div id="loading">Loading...</div>
                <div id="newsList"></div>
            `;
            loadRequests();
        }

        // 👇👇👇 DATA LOAD
        function loadRequests(){
            db.collection("pendingNews").where("status","==","pending")
            .onSnapshot(snap => {
                document.getElementById('loading').style.display='none';
                let html = "";
                snap.forEach(doc => {
                    const n = doc.data();
                    html += `
                    <div class="card">
                        <img src="${n.image}" width="200" style="border-radius:5px">
                        <h3>${n.title}</h3>
                        <p>${n.description}</p>
                        <button onclick="update('${doc.id}','approved')" 
                            style="background:green;color:white;padding:8px 15px;border:none;border-radius:5px;margin-right:10px">
                            Approve
                        </button>
                        <button onclick="update('${doc.id}','rejected')" 
                            style="background:red;color:white;padding:8px 15px;border:none;border-radius:5px">
                            Reject
                        </button>
                    </div>`;
                })
                document.getElementById('newsList').innerHTML = html || "No pending requests";
            })
        }

        // 👇👇👇 UPDATE STATUS
        function update(id,status){
            db.collection("pendingNews").doc(id).update({status})
        }
    </script>
</body>
</html>
