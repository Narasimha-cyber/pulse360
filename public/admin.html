<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Pulse360</title>
    <style>
        body {font-family: Arial; margin: 20px; background: #f5f5f5;}
        .news-card {background: white; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
        .news-title {font-size: 20px; font-weight: bold; margin-bottom: 8px;}
        .news-image {max-width: 300px; border-radius: 5px; margin: 10px 0;}
        button {padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        button:hover {background: #218838;}
    </style>
    <script type="importmap">
    {"imports": {"firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
    </script>
</head>
<body>
    <h2>Admin Panel - Pending News</h2>
    <div id="newsContainer"><p>Loading pending news...</p></div>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp } from 'firebase/firestore';

        const firebaseConfig = {
            apiKey: "AIzaSyA4cKX7gqRw1vllvlgzW2tC9x3zYbX9sQ",
            authDomain: "pulse360news.firebaseapp.com",
            projectId: "pulse360news",
            storageBucket: "pulse360news.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcd1234"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function loadPendingNews() {
            const newsContainer = document.getElementById('newsContainer');
            const q = query(collection(db, 'pendingNews'));

            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    newsContainer.innerHTML = '<p>No pending news</p>';
                    return;
                }
                let newsHTML = '';
                snapshot.forEach((docSnap) => {
                    const news = docSnap.data();
                    newsHTML += `
                        <div class="news-card">
                            <div class="news-title">${news.title}</div>
                            <img src="${news.image}" class="news-image" onerror="this.style.display='none'">
                            <div><b>Description:</b> ${news.description}</div>
                            <div><b>Submitted:</b> ${news.createdAt ? new Date(news.createdAt.seconds*1000).toLocaleString() : ''}</div>
                            <button onclick="approveNews('${docSnap.id}')">Approve</button>
                        </div>
                    `;
                });
                newsContainer.innerHTML = newsHTML;
            }, (error) => {
                newsContainer.innerHTML = `<p style="color:red">Error: ${error.message}</p>`;
            });
        }

        window.approveNews = async function(docId) {
            if(!confirm("Approve this news?")) return;
            try {
                const newsRef = doc(db, 'pendingNews', docId);
                const newsSnap = await getDocs(query(collection(db, 'pendingNews'), where('__name__', '==', docId)));
                let newsData;
                newsSnap.forEach(d => newsData = d.data());

                // publishedNews lo veyyi
                await setDoc(doc(db, 'publishedNews', docId), {
                    ...newsData,
                    status: 'published',
                    approvedAt: serverTimestamp()
                });
                // pendingNews nunchi delete
                await deleteDoc(newsRef);
                alert('News Approved Successfully!');
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        loadPendingNews();
    </script>
</body>
</html>
