<!DOCTYPE html>
<html>
<head>
  <title>Admin - Pulse360</title>
  <style>body{font-family:sans-serif;padding:20px}.card{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px}</style>
</head>
<body>
<h2 style="color:#ff6b35">Pending News Requests</h2>
<div id="loading">Loading...</div>
<div id="newsList"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
  // 👇 SAME FIREBASE CONFIG IKKADA KUDA PASTE CHEYYI
  const firebaseConfig = {
    apiKey: "AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",
    authDomain: "pulse360-news.firebaseapp.com",
    projectId:  "pulse360-news",
    appId: "1:789441397313:web:ff3abd4184818b23d13cc0",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  db.collection("pendingNews").where("status","==","pending")
 .onSnapshot(snap => {
    document.getElementById('loading').style.display='none';
    let html = "";
    snap.forEach(doc => {
      const n = doc.data();
      html += `<div class="card">
        <img src="${n.image}" width="200" style="border-radius:5px">
        <h3>${n.title}</h3><p>${n.description}</p>
        <button onclick="update('${doc.id}','approved')" style="background:green;color:white;padding:8px 15px;border:none;border-radius:5px;margin-right:10px">Approve</button>
        <button onclick="update('${doc.id}','rejected')" style="background:red;color:white;padding:8px 15px;border:none;border-radius:5px">Reject</button>
      </div>`;
    })
    document.getElementById('newsList').innerHTML = html || "No pending requests";
  })

  function update(id,status){
    db.collection("pendingNews").doc(id).update({status})
  }
</script>
</body>
</html>
