<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Pulse360</title>
<style>
body{font-family:Arial;background:#f1f1f1;padding:20px;margin:0}
h1{text-align:center;color:#333}
.card{background:white;padding:15px;margin:15px auto;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);max-width:600px}
.card img{width:100%;max-height:300px;object-fit:cover;border-radius:5px;margin:10px 0}
.btn{padding:10px 20px;border:none;border-radius:5px;color:white;cursor:pointer;margin-right:10px;font-weight:bold;font-size:16px}
.approve{background:#28a745}
.reject{background:#dc3545}
#newsList{text-align:center}
</style>
</head>
<body>
<h1>📰 Admin Panel - Pending News</h1>
<div id="newsList">Loading...</div>

<script>
const SCRIPT_URL ="https://script.google.com/macros/s/AKfycbyX2RQRf1jIX_oi5AwH3Qf8UId1gkYb_HpjHXSm3TpmB1Su8v6chQV1ItCxYP0h0B3U/exec";

async function loadNews(){
  try{
    let res = await fetch(SCRIPT_URL + "?action=getPending");
    let data = await res.json();
    let html = "";
    if(data.length === 0){ html = "<p>Ippudu Pending News levu ✅</p>" }
    data.forEach(item => {
      html += `
      <div class="card">
        <h3>${item.name}</h3>
        <p><b>Phone:</b> ${item.phone}</p>
        <p><b>Story:</b> ${item.story}</p>
        <img src="${item.photo}" />
        <p><b>Time:</b> ${item.timestamp}</p>
        <button class="btn approve" onclick="updateStatus('${item.row}', 'Approved')">Approve</button>
        <button class="btn reject" onclick="updateStatus('${item.row}', 'Rejected')">Reject</button>
      </div>`
    });
    document.getElementById("newsList").innerHTML = html;
  } catch(e){
    document.getElementById("newsList").innerHTML = "<p>Error: Apps Script lo 'getPending' function add cheyyali</p>"
  }
}

async function updateStatus(row, status){
  await fetch(SCRIPT_URL + `?action=update&row=${row}&status=${status}`);
  alert(status + " chesam!");
  loadNews();
}
loadNews();
</script>
</body>
</html>
