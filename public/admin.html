<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Pulse360</title>
<style>
  body{font-family:'Segoe UI',Arial;background:#0a0a0a;color:#fff;margin:0;padding:20px}
  h1{color:#00ff88;text-align:center}
  .card{background:#1a1a1a;padding:20px;margin:15px 0;border-radius:10px;border-left:4px solid #00ff88}
  .card h3{margin:0 0 10px;color:#00ff88}
  .card p{margin:5px 0;color:#ccc}
  .btn{background:#00ff88;color:#000;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;cursor:pointer}
  .btn:hover{background:#00cc6a}
  .empty{text-align:center;color:#888;margin-top:50px}
</style>
</head>
<body>
<h1>🛡️ Pulse360 Admin Panel</h1>
<div id="pendingList" class="empty">Loading pending news...</div>

<script type="module">
  // Firebase v9 Modular - idi stable
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",
    authDomain: "pulse360-news.firebaseapp.com",
    projectId: "pulse360-news"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const pendingList = document.getElementById('pendingList');

  // 1. pendingNews ni live ga chadavadam
  onSnapshot(collection(db, "pendingNews"), (snapshot) => {
    if(snapshot.empty){
      pendingList.innerHTML = `<div class="empty">Ippudu pending news emi ledu bro</div>`;
      return;
    }
    
    let html = "";
    snapshot.forEach((docSnap) => {
      const n = docSnap.data();
      html += `
      <div class="card">
        <h3>${n.title}</h3>
        <p>${n.description}</p>
        <p><b>City:</b> ${n.city || 'N/A'} | <b>Time:</b> ${n.createdAt ? new Date(n.createdAt.seconds*1000).toLocaleString() : 'N/A'}</p>
        <button class="btn" onclick="approveNews('${docSnap.id}')">✅ Approve & Publish</button>
      </div>`
    })
    pendingList.innerHTML = html;
  }, (error) => {
    pendingList.innerHTML = `<div class="empty" style="color:red">Error: ${error.message}</div>`;
  });

  // 2. Approve function - publishedNews ki move chesthundi
  window.approveNews = async function(id){
    try{
      const docRef = doc(db, "pendingNews", id);
      const docSnap = await getDoc(docRef);
      await addDoc(collection(db, "publishedNews"), docSnap.data());
      await deleteDoc(docRef);
      alert("✅ Approved! Website lo live ayindi");
    }catch(e){
      alert("Error: " + e.message)
    }
  }
</script>
</body></html>
