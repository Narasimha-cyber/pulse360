<!DOCTYPE html>
<html><head><title>Pulse360 News</title></head><body>
<h1>🔥 Pulse360 Live News</h1>
<a href="/submit.html">📢 Submit News</a>
<div id="news">Loading...</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",authDomain:"pulse360-news.firebaseapp.com",projectId:"pulse360-news"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.collection("publishedNews").orderBy("createdAt","desc").onSnapshot(s=>{document.getElementById('news').innerHTML="";s.forEach(d=>{let n=d.data();document.getElementById('news').innerHTML+=`<h2>${n.title}</h2><p>${n.description}</p>`;})})
</script></body></html>
