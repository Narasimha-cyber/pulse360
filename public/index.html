<!DOCTYPE html>
<html>
<head>
<title>Pulse360 News - Eluru</title>
<style>
  body{font-family:Arial;margin:0;padding:0;background:#f9f9f9}
  header{background:#007bff;color:white;padding:15px;text-align:center}
  .container{max-width:900px;margin:20px auto;padding:20px}
  .news-card{background:white;padding:15px;margin:10px 0;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
  iframe{border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
</style>
</head>
<body>

<header>
  <h1>🔥 Pulse360 News</h1>
</header>

<div class="container">

  <h2>📢 News Submit Cheyi</h2>
  <!-- Ikkada nuvvu ichina form link embed chesam -->
  <iframe src="https://pulse360news.in/submit" width="100%" height="650px" style="border:none"></iframe>

  <hr style="margin:30px 0">

  <h2>📰 Live News - Eluru</h2>
  <div id="newsList">Loading...</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyAITlkoZIsMx99BDrj14I1S-ZtdEMsd1kc",authDomain:"pulse360-news.firebaseapp.com",projectId:"pulse360-news"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Live news chupinchadam
db.collection("publishedNews").where("city","==","Eluru").orderBy("createdAt","desc")
.onSnapshot(snapshot=>{
  let html = "";
  if(snapshot.empty) html = "<p>Ippudu Eluru lo news ledu</p>";
  snapshot.forEach(doc=>{
    let n = doc.data();
    html += `<div class="news-card"><h3>${n.title}</h3><p>${n.description}</p></div>`
  })
  document.getElementById('newsList').innerHTML = html;
})
</script>
</body></html>
